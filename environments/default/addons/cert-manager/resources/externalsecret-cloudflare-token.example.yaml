---
# The Cloudflare DNS token pulled from a secret backend by external-secrets (GIT-6) instead of living
# in the cluster as a hand-made Secret. Requires the external-secrets addon + a ClusterSecretStore.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager # see the external-secrets addon examples
  target:
    name: cloudflare-api-token-secret
  data:
    - secretKey: api-token
      remoteRef:
        key: cert-manager/cloudflare # path in the backend
        property: api-token
