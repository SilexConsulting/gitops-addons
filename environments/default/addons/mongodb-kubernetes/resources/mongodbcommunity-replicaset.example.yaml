# Example: a 3-member MongoDB Community replica set with one SCRAM application user.
#   * Lives in the operator's namespace (`mongodb`); for another namespace add it to
#     `operator.watchNamespace` (see ../values.yaml).
#   * The `app-user-password` Secret (key `password`) must exist first — SOPS or an ExternalSecret
#     from the private repo, never plain Git. The operator writes the connection string to the
#     Secret `<name>-<db>-<user>` (here `example-mongodb-admin-app-user`).
#   * Pick a `version` published as quay.io/mongodb/mongodb-community-server:<version>-ubi8.
apiVersion: mongodbcommunity.mongodb.com/v1
kind: MongoDBCommunity
metadata:
  name: example-mongodb
  namespace: mongodb
spec:
  type: ReplicaSet
  members: 3
  version: "8.0.32"
  security:
    authentication:
      modes: ["SCRAM"]
  users:
    - name: app-user
      db: admin
      passwordSecretRef:
        name: app-user-password
      roles:
        - name: readWrite
          db: app
      scramCredentialsSecretName: app-user
  statefulSet:
    spec:
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi
