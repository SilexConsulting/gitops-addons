# mongodb-kubernetes addon-owned resources (commented-out reference setup).
#
# Synced by the mongodb addon's own Application ONLY if the `path:` on the first source of
# gitops/addons/oss/mongodb/addons-mongodb-appset.yaml is uncommented, so they exist iff the addon
# is enabled. Databases normally belong to the workload that owns the data; list here only what
# should exist whenever the operator does. User password Secrets are never in plain Git: SOPS /
# ExternalSecret from the private repo.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The CRs depend on the chart's CRDs (first sync), and must never be pruned/deleted by Argo: a
# MongoDBCommunity deletion tears down its StatefulSet (and, with Longhorn reclaim=Delete, the data).
commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true,Prune=false,Delete=false
  argocd.argoproj.io/sync-wave: "10"
resources: []
#  - mongodbcommunity-replicaset.example.yaml
