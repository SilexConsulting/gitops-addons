---
# L2 mode: a node answers ARP/NDP for the Service IP. The pool must be in the nodes' subnet.
# An empty spec advertises every pool.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: default-advertise-all-pools
  namespace: metallb-system
spec: {}
# spec:
#   ipAddressPools: [default-addresspool]  # limit to named pools
