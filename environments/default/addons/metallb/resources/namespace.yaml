---
# metallb-system, created with (and only with) the metallb addon. The speaker needs host networking
# and NET_RAW, so the namespace is privileged under Pod Security Admission.
# Delete=false: removing the addon must never delete the namespace (and the pools/peers in it).
apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Delete=false
