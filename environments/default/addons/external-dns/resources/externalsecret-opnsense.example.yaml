---
# The OPNsense API key pair for the external-dns OPNsense webhook, pulled from a secret backend by
# external-secrets (GIT-6) instead of living in the cluster as a hand-made Secret. Requires the
# external-secrets addon + a ClusterSecretStore. Name/keys must match the webhook `env` in values.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-dns-opnsense
  namespace: external-dns
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager # see the external-secrets addon examples
  target:
    name: external-dns-opnsense
  data:
    - secretKey: api_key
      remoteRef:
        key: external-dns/opnsense # path in the backend
        property: api_key
    - secretKey: api_secret
      remoteRef:
        key: external-dns/opnsense
        property: api_secret
