---
# AWS Secrets Manager via static credentials held in a bootstrap Secret (SOPS-seeded), e.g.
#   kubectl -n external-secrets create secret generic aws-secretsmanager-credentials \
#     --from-literal=access-key-id=... --from-literal=secret-access-key=...
# Use a narrowly-scoped IAM user (secretsmanager:GetSecretValue on a path prefix only).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-2
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secretsmanager-credentials
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: aws-secretsmanager-credentials
            namespace: external-secrets
            key: secret-access-key
