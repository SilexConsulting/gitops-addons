---
# Kubernetes provider: read Secrets from one "vault" namespace in this cluster and project them into
# others. Handy for a homelab without an external secret manager (seed the source namespace via SOPS).
# The referenced service account needs get/list on Secrets in `remoteNamespace` (Role + RoleBinding).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-secrets
spec:
  provider:
    kubernetes:
      remoteNamespace: cluster-secrets
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: external-secrets
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets
          namespace: external-secrets
