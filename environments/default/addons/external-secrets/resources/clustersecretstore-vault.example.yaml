---
# HashiCorp Vault (KV v2) using Kubernetes auth: ESO's service account logs in to Vault; no static
# token in the cluster. Requires a Vault role bound to system:serviceaccount:external-secrets:external-secrets.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
spec:
  provider:
    vault:
      server: https://vault.example.internal:8200
      path: secret # the KV mount
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
