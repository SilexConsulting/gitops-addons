---
# A StorageClass whose PVs survive deletion of their PVC (reclaimPolicy: Retain) — for data that must
# not disappear with an app (databases, document stores). Released PVs must be cleaned up by hand.
# StorageClass parameters are immutable: to change one, delete the class (existing PVs are unaffected)
# and let Argo recreate it.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-retain
provisioner: driver.longhorn.io
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "3" # <= number of storage nodes
  staleReplicaTimeout: "30"
  fsType: ext4
  dataLocality: disabled
  dataEngine: v1
  # Put these volumes in the recurring-job groups that back them up (see recurringjob-*.example.yaml).
  recurringJobSelector: '[{"name":"default","isGroup":true}]'
