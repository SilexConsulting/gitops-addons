---
# The backup target's S3 credentials via external-secrets (GIT-6), referenced by the cluster's
# `defaultBackupStore.backupTargetCredentialSecret`. Keys are what Longhorn expects for S3.
# Without external-secrets, seed the same Secret out-of-band (e.g. SOPS) instead.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-backup-s3
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager # see the external-secrets addon examples
  target:
    name: longhorn-backup-s3
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef: { key: longhorn/backup-s3, property: access_key_id }
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef: { key: longhorn/backup-s3, property: secret_access_key }
    - secretKey: AWS_ENDPOINTS # only for non-AWS S3 (MinIO, B2...); omit for AWS
      remoteRef: { key: longhorn/backup-s3, property: endpoint }
