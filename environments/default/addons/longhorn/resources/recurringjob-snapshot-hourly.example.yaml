---
# Hourly local snapshots (on the replicas, not off-cluster) for quick rollback, keeping 24.
# Snapshots are NOT backups: they die with the volume.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-hourly
  namespace: longhorn-system
spec:
  task: snapshot
  cron: "0 * * * *"
  retain: 24
  concurrency: 2
  groups:
    - default
  labels: {}
  parameters: {}
