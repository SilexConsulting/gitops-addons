dex:
  enabled: false
notifications:
  enabled: false

# Argo CD manages itself: this is the default config every self-managed Argo CD converges to
# after the Terraform bootstrap (which only seeds the install). Keep the control-plane
# `argocd_helm_values` seeds in step with the shared baseline below.
global:
  domain: argocd.cluster.local
  addPrometheusAnnotations: true
controller:
  logFormat: json
  metrics:
    enabled: true
server:
  service:
    type: NodePort
  ingress:
    enabled: false
    ingressClassName: nginx
    tls: false
  extensions:
    enabled: true
    extensionList:
      - name: rollout-extension
        env:
          - name: EXTENSION_URL
            value: https://github.com/argoproj-labs/rollout-extension/releases/download/v0.4.0/extension.tar
