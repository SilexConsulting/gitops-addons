# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-metallb
  namespace: argocd
spec:
  syncPolicy:
    # GIT-3: never cascade-delete. The CRDs hold every cluster's pools/peers; losing them drops
    # every LoadBalancer IP.
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: metallb
                addonChartVersion: 0.16.1
                addonChartRepository: https://metallb.github.io/metallb
              selector:
                matchExpressions:
                  - key: enable_metallb
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
          # Addon-owned resources (namespace; generic config): exist iff this addon is enabled.
          path: environments/default/addons/{{values.addonChart}}/resources
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: metallb-system
        name: '{{name}}'
      syncPolicy:
        automated: {}
        # Config CRs (pools/peers) can race the chart's CRDs + validating webhook on first sync.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big CRDs.
