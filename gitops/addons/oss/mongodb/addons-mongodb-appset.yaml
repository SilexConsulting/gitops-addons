# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-mongodb
  namespace: argocd
spec:
  syncPolicy:
    # GIT-2: never cascade-delete the MongoDB operator. The chart ships the CRDs, so a cascading
    # delete (or the appset dropping it, e.g. enable_mongodb removed) would delete the CRDs ->
    # every MongoDBCommunity / MongoDB -> their PVCs -> the data (Longhorn reclaim=Delete).
    # With `true` the generated apps carry no resources-finalizer, so deletion orphans resources.
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                # MongoDB Controllers for Kubernetes (MCK) — the successor to the deprecated
                # community-operator; reconciles MongoDBCommunity (and Enterprise) resources.
                addonChart: mongodb-kubernetes
                addonChartVersion: 1.13.0
                addonChartRepository: https://mongodb.github.io/helm-charts
                addonChartNamespace: mongodb
              selector:
                matchExpressions:
                  - key: enable_mongodb
                    operator: In
                    values: ['true']
          # A merge generator needs >= 2 children; this (empty) per-env override is also where
          # env-specific values go, and it keeps the appset valid on clusters without a private
          # overlay that appends its own child.
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      # Source order matters: the private overlay patches append value files to sources/1.
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
          # --- Addon-owned resources (exist iff this addon is enabled) --------------------------
          # The operator needs nothing besides the chart. Databases (MongoDBCommunity + their user
          # password Secrets) normally belong to the workload that owns the data. Databases that
          # should exist whenever the operator does can ship here:
          #   1. Private repo (recommended, per cluster): put them in
          #      <private>/addons/clusters/<cluster>/mongodb-kubernetes/resources/ and target this
          #      appset with gitops-private's `add-private-source-with-resources.yaml` patch.
          #   2. Catalogue-wide default: uncomment the path below and list them in
          #      environments/default/addons/mongodb-kubernetes/resources/ (see the commented examples there).
          # path: environments/default/addons/{{values.addonChart}}/resources
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      # The operator registers its ValidatingWebhookConfiguration at runtime (not part of the chart),
      # so Argo never tracks it and no ignoreDifferences are needed.
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # Big CRDs.
