# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-samba-operator
  namespace: argocd
spec:
  syncPolicy:
    # GIT-33: never cascade-delete. The chart owns the SmbShare/SmbCommonConfig/SmbSecurityConfig
    # CRDs; deleting them deletes every SmbShare -> its smbd Deployment + Service (and any PVC the
    # operator created from `storage.pvc.spec`).
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: samba-operator
                # SilexConsulting/samba-operator-helm (upstream ships no chart). Chart 0.1.0 = operator v0.8.
                addonChartVersion: 0.1.0
                # Helm OCI registry (no scheme) — declared to Argo CD with enableOCI in
                # gitops/addons/repositories/ghcr-silexconsulting-charts.yaml.
                addonChartRepository: ghcr.io/silexconsulting/charts
                # Upstream's namespace + release name: object names then match a `make deploy`
                # install exactly, so an existing install is adopted in place.
                addonChartNamespace: samba-operator-system
              selector:
                matchExpressions:
                  - key: enable_samba_operator
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      # Source order matters: the private overlay patches append value files to sources/1.
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
          # --- Addon-owned resources (exist iff this addon is enabled) --------------------------
          # The operator needs nothing besides the chart. Shares (SmbShare + optional SmbCommonConfig
          # / SmbSecurityConfig) belong to the workload that owns the data — e.g. a workload chart's
          # own `samba:` block — not to this addon. Cluster-wide defaults that should exist whenever
          # the operator does (e.g. a shared SmbSecurityConfig) can ship here:
          #   1. Private repo (recommended, per cluster): put them in
          #      <private>/addons/clusters/<cluster>/samba-operator/resources/ and target this appset
          #      with gitops-private's `add-private-source-with-resources.yaml` patch.
          #   2. Catalogue-wide default: uncomment the path below and list them in
          #      environments/default/addons/samba-operator/resources/ (see the commented examples there).
          # path: environments/default/addons/{{values.addonChart}}/resources
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated: {}
        # The namespace is created by Argo (CreateNamespace), so it exists iff the addon is enabled.
        # Only the operator runs here; each share's smbd pod runs in the share's own namespace.
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
