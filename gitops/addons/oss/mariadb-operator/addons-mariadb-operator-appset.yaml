# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-mariadb-operator
  namespace: argocd
spec:
  syncPolicy:
    # GIT-31: never cascade-delete the MariaDB operator. The CRDs chart is part of this app, so a
    # cascading delete (or the appset dropping it, e.g. enable_mariadb_operator removed) would
    # delete the CRDs -> every MariaDB -> their PVCs -> the data (Longhorn reclaim=Delete).
    # With `true` the generated apps carry no resources-finalizer, so deletion orphans resources.
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: mariadb-operator
                # The operator and CRDs charts are released in lockstep — one version for both.
                addonChartVersion: 26.10.1
                addonChartRepository: https://helm.mariadb.com/mariadb-operator
                addonChartNamespace: mariadb-operator
              selector:
                matchExpressions:
                  - key: enable_mariadb_operator
                    operator: In
                    values: ['true']
          # A merge generator needs >= 2 children; this (empty) per-env override is also where
          # env-specific values go, and it keeps the appset valid on clusters without a private
          # overlay that appends its own child (e.g. ivylen's pin).
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      # Source order matters: the private overlay patches append value files to sources/1, so
      # the operator chart must stay at index 1 (the CRDs chart takes no values).
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
        - chart: '{{values.addonChart}}-crds'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}-crds'
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      # The operator's cert-controller injects the CA bundle into its webhook at runtime.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true  # Big CRDs.
          - RespectIgnoreDifferences=true
