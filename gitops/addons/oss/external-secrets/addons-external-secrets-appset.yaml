# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-external-secrets
  namespace: argocd
spec:
  syncPolicy:
    # GIT-6: never cascade-delete. The chart owns the CRDs; deleting them deletes every
    # ExternalSecret, and the Secrets they own (creationPolicy: Owner) are garbage-collected with
    # them -> workloads lose their credentials. With `true` deletion orphans resources instead.
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: external-secrets
                addonChartVersion: 2.11.0
                addonChartRepository: https://charts.external-secrets.io
                addonChartNamespace: external-secrets
              selector:
                matchExpressions:
                  - key: enable_external_secrets
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      # Source order matters: the private overlay patches append value files to sources/1.
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
          # --- Addon-owned resources (exist iff this addon is enabled) --------------------------
          # ESO does nothing until it has a SecretStore/ClusterSecretStore pointing at a backend
          # (Vault, AWS Secrets Manager, ...). Those are site-specific, so the catalogue ships none:
          #   1. Private repo (recommended, per cluster): put ClusterSecretStores in
          #      <private>/addons/clusters/<cluster>/external-secrets/resources/ and target this
          #      appset with gitops-private's `add-private-source-with-resources.yaml` patch.
          #   2. Catalogue-wide default (only if every cluster uses the same backend): uncomment the
          #      path below and list them in environments/default/addons/external-secrets/resources/
          #      (see the commented examples there).
          # The ExternalSecrets that CONSUME a store are workload-owned: they live with the workload
          # (gitops-workloads resources, GIT-20), not here.
          # path: environments/default/addons/{{values.addonChart}}/resources
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      # ESO's cert-controller fills the webhook cert Secret and injects the CA bundle into the
      # ValidatingWebhookConfigurations at runtime; don't fight it.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - kind: Secret
          name: external-secrets-webhook
          jsonPointers:
            - /data
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big CRDs.
          - RespectIgnoreDifferences=true
