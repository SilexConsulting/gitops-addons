# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-cert-manager
  namespace: argocd
spec:
  syncPolicy:
    # GIT-17: never cascade-delete. The chart owns the CRDs; deleting them deletes every Issuer,
    # ClusterIssuer and Certificate on the cluster.
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: cert-manager
                addonChartVersion: v1.21.2
                addonChartRepository: https://charts.jetstack.io
                addonChartNamespace: cert-manager
              selector:
                matchExpressions:
                  - key: enable_cert_manager
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      # Source order matters: the private overlay patches append value files to sources/1.
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
          # --- Addon-owned resources (exist iff this addon is enabled) --------------------------
          # cert-manager issues nothing until it has an Issuer/ClusterIssuer (ACME account, DNS or
          # HTTP solver, CA...). Those are site-specific, so the catalogue ships none:
          #   1. Private repo (recommended, per cluster): put ClusterIssuers in
          #      <private>/addons/clusters/<cluster>/cert-manager/resources/ and target this appset
          #      with gitops-private's `add-private-source-with-resources.yaml` patch.
          #   2. Catalogue-wide default (only if every cluster issues the same way): uncomment the
          #      path below and list them in environments/default/addons/cert-manager/resources/
          #      (see the commented examples there).
          # Certificates themselves are workload-owned (an Ingress annotation or a Certificate next to
          # the workload), not addon resources.
          # path: environments/default/addons/{{values.addonChart}}/resources
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      # cert-manager's cainjector writes the CA bundle into its own webhook configurations at
      # runtime (cert-manager.io/inject-ca-from-secret); don't fight it.
      ignoreDifferences:
        - group: admissionregistration.k8s.io
          kind: ValidatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
        - group: admissionregistration.k8s.io
          kind: MutatingWebhookConfiguration
          jqPathExpressions:
            - .webhooks[]?.clientConfig.caBundle
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true # Big CRDs.
          - RespectIgnoreDifferences=true
