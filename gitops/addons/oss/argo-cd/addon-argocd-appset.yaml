---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-argocd
  namespace: argocd
spec:
  syncPolicy:
    # This app manages Argo CD itself (release argo-cd in argocd). A cascading delete of it (or
    # the appset dropping it, e.g. enable_argocd removed) would delete Argo CD. With `true` the
    # generated apps carry no resources-finalizer, so deletion orphans resources instead.
    preserveResourcesOnDeletion: true
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: argo-cd
                addonChartVersion: 10.9.2
                addonChartRepository: https://argoproj.github.io/argo-helm
                addonChartNamespace: argocd
              selector:
                matchExpressions:
                  - key: enable_argocd
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
            # Register the (public) catalogue repos in Argo CD's repository list, from each
            # cluster's own annotations so the URLs always match what the apps use. HTTPS, no
            # credentials (they're public), so the chart-rendered Secrets hold nothing sensitive.
            # Private repos (gitops-private) keep their SOPS-managed Secrets.
            values: |
              configs:
                repositories:
                  gitops-addons:
                    url: '{{metadata.annotations.addons_repo_url}}'
                    type: git
                    name: gitops-addons
                  gitops-workloads:
                    url: '{{metadata.annotations.workloads_repo_url}}'
                    type: git
                    name: gitops-workloads
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated: {}
        syncOptions:
          - CreateNamespace=true
          # GIT-26: Argo CD >= 3.3 ships an ApplicationSet CRD too large for client-side apply
          # (last-applied annotation "Too long"), so a self-upgrade must use server-side apply.
          - ServerSideApply=true
