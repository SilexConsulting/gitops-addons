# nonk8s
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-external-dns
  namespace: argocd
spec:
  # No preserveResourcesOnDeletion: the chart ships no CRDs and holds no state in the cluster. Deleting
  # the Application only stops reconciliation — records already written to the DNS provider stay put.
  generators:
    - merge:
        mergeKeys: [server]
        generators:
          - clusters:
              values:
                addonChart: external-dns
                addonChartVersion: 1.22.0
                addonChartRepository: https://kubernetes-sigs.github.io/external-dns/
                addonChartNamespace: external-dns
              selector:
                matchExpressions:
                  - key: enable_external_dns
                    operator: In
                    values: ['true']
          - clusters:
              selector:
                matchLabels:
                  environment: dev
              values:
  template:
    metadata:
      name: addon-{{name}}-{{values.addonChart}}
    spec:
      project: addons
      # Source order matters: the private overlay patches append value files to sources/1.
      sources:
        - repoURL: '{{metadata.annotations.addons_repo_url}}'
          targetRevision: '{{metadata.annotations.addons_repo_revision}}'
          ref: values
          # --- Addon-owned resources (exist iff this addon is enabled) --------------------------
          # ExternalDNS itself is configured through values (provider, domain filter — see
          # environments/default/addons/external-dns/values.yaml). The one thing it needs besides
          # values is the DNS provider's API credential Secret, which is site-specific and never in
          # plain Git:
          #   1. Private repo (recommended, per cluster): a SOPS-encrypted Secret applied out-of-band,
          #      or an ExternalSecret in <private>/addons/clusters/<cluster>/external-dns/resources/
          #      targeted with gitops-private's `add-private-source-with-resources.yaml` patch.
          #   2. Catalogue-wide default: uncomment the path below and list the ExternalSecret in
          #      environments/default/addons/external-dns/resources/ (see the commented example there).
          # path: environments/default/addons/{{values.addonChart}}/resources
        - chart: '{{values.addonChart}}'
          repoURL: '{{values.addonChartRepository}}'
          targetRevision: '{{values.addonChartVersion}}'
          helm:
            releaseName: '{{values.addonChart}}'
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/environments/default/addons/{{values.addonChart}}/values.yaml
              - $values/environments/{{metadata.labels.environment}}/addons/{{values.addonChart}}/values.yaml
              - $values/clusters/{{name}}/addons/{{values.addonChart}}/values.yaml
            parameters:
              # TXT-registry owner: each cluster only ever updates/deletes the records it created, so
              # hand-made records and other clusters' records in the same zone are left alone.
              - name: txtOwnerId
                value: '{{name}}'
      destination:
        namespace: '{{values.addonChartNamespace}}'
        name: '{{name}}'
      syncPolicy:
        automated: {}
        # The namespace is created by Argo (CreateNamespace), so it exists iff the addon is enabled.
        syncOptions:
          - CreateNamespace=true
